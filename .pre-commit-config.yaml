repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: poetry run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: poetry run ruff format
        language: system
        types: [python]

      - id: bandit
        name: Bandit security check
        entry: poetry run bandit -ll
        language: system
        types: [python]